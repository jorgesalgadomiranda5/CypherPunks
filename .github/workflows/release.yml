name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: git archive --format=zip --prefix=CypherPunks/ -o "CypherPunks-${GITHUB_REF_NAME}.zip" HEAD
      - run: gh release create "$GITHUB_REF_NAME" "CypherPunks-${GITHUB_REF_NAME}.zip" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
